name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required documentation files
        run: |
          test -f README.md
          test -f docs/SRS.md

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm install

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  php:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: legacy-php

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Check PHP syntax
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

  analytics:
    name: Analytics CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install analytics test dependencies
        run: pip install pytest pyspark==4.1.2 mysql-connector-python PyYAML

      - name: Compile analytics Python
        run: python -m compileall analytics

      - name: Run data generator tests
        run: pytest -q analytics/data_generator/test_generate_retail_media_data.py

      - name: Run PySpark transformation tests
        run: pytest -q analytics/pyspark/tests

      - name: Validate ThoughtSpot TML templates
        run: pytest -q analytics/thoughtspot/test_validate_tml.py

      - name: Validate watchdog shell syntax
        run: bash -n scripts/*.sh
