apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-inventory
  labels:
    app: backend
    app.kubernetes.io/name: smart-inventory-backend
    app.kubernetes.io/part-of: smart-inventory-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: smart-inventory-backend
        app.kubernetes.io/part-of: smart-inventory-erp
    spec:
      containers:
        - name: backend
          image: smart-inventory-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: BACKEND_PORT

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: DB_PORT

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: DB_USER

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: DB_NAME

            - name: PHP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: PHP_SERVICE_URL

            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: smart-inventory-config
                  key: TRUST_PROXY

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secret
                  key: DB_PASSWORD

            # Asymmetric RS256 JWT keys. The private key is mounted only on
            # this backend deployment — the frontend deployment never receives
            # it. See ingress.yaml for the proxy-header normalization that
            # makes X-Forwarded-Proto trustworthy.
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/jwt-keys/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/jwt-keys/jwt_public.pem

          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt-keys
              readOnly: true

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: jwt-keys
          secret:
            secretName: smart-inventory-secret
            items:
              - key: jwt_private.pem
                path: jwt_private.pem
                mode: 0400
              - key: jwt_public.pem
                path: jwt_public.pem
                mode: 0444

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smart-inventory
  labels:
    app: backend
    app.kubernetes.io/name: smart-inventory-backend
    app.kubernetes.io/part-of: smart-inventory-erp
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5001
      targetPort: 5001
